<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Portail Académique FSTG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5 col-xl-4">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="bg-primary p-4 text-center text-white">
                        <i class="bi bi-shield-lock-fill display-4 mb-2"></i>
                        <h4 class="fw-bold mb-0">Portail FSTG</h4>
                        <small class="text-white-50">Authentification Sécurisée</small>
                    </div>

                    <div class="card-body p-4 p-sm-5 bg-white">
                        <!-- Message d'erreur -->
                        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 py-2 small" role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
                            <div>Identifiant ou mot de passe incorrect.</div>
                        </div>

                        <!-- Message de déconnexion -->
                        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2 small" role="alert">
                            <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                            <div>Vous avez été déconnecté avec succès.</div>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Nom d'utilisateur</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="Nom d'utilisateur" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Mot de passe</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 shadow-sm">
                                <i class="bi bi-box-arrow-in-right"></i> Se connecter
                            </button>
                        </form>

                        <!-- Comptes de test prédéfinis -->
                        <div class="mt-4 pt-3 border-top">
                            <p class="text-muted small fw-bold mb-2"><i class="bi bi-info-circle"></i> Comptes de test en mémoire :</p>
                            <div class="small bg-light p-3 rounded-3 text-secondary">
                                <div class="mb-1 d-flex justify-content-between">
                                    <span><strong>etudiant</strong></span>
                                    <code>etudiant123</code>
                                </div>
                                <div class="mb-1 d-flex justify-content-between">
                                    <span><strong>professeur</strong></span>
                                    <code>prof123</code>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span><strong>admin</strong></span>
                                    <code>admin123</code>
                                </div>
                            </div>
                        </div>

                        <div class="text-center mt-3">
                            <a th:href="@{/}" class="text-decoration-none small text-muted">
                                <i class="bi bi-arrow-left"></i> Retour à l'accueil public
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
